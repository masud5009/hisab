<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — হিসাব</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"/>
  <style>
    :root {
      --clr-bg: #f6f8fb;
      --clr-card: #ffffff;
      --clr-border: #d8dee8;
      --clr-primary: #d99a00;
      --clr-text: #172033;
      --clr-muted: #667085;
      --clr-input-bg: #ffffff;
    }
    body {
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(217,154,0,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .login-wrap {
      width: 100%; max-width: 420px;
      background: var(--clr-card);
      border: 1px solid var(--clr-border);
      border-radius: 18px;
      padding: 2.5rem;
      position: relative;
      box-shadow: 0 24px 64px rgba(15,23,42,0.12);
    }
    .top-accent {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 80px; height: 3px;
      background: var(--clr-primary);
      border-radius: 0 0 4px 4px;
    }
    .back-link {
      color: var(--clr-muted);
      font-size: 0.875rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--clr-text); }
    .login-icon {
      width: 56px; height: 56px;
      background: rgba(217,154,0,0.12);
      border: 1.5px solid rgba(217,154,0,0.35);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: var(--clr-muted); font-size: 0.875rem; margin-bottom: 1.75rem; }
    label { font-size: 0.85rem; font-weight: 500; color: var(--clr-muted); margin-bottom: 0.35rem; display: block; }
    .form-control {
      background: var(--clr-input-bg);
      border: 1px solid var(--clr-border);
      color: var(--clr-text);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      font-family: 'Space Grotesk', sans-serif;
    }
    .form-control:focus {
      background: var(--clr-input-bg);
      color: var(--clr-text);
      border-color: var(--clr-primary);
      box-shadow: 0 0 0 3px rgba(247,201,72,0.15);
      outline: none;
    }
    .btn-login {
      width: 100%;
      background: var(--clr-primary);
      color: #111827;
      font-weight: 700;
      border: none;
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
    }
    .btn-login:hover { background: #c88a00; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(217,154,0,0.24); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .alert { border-radius: 10px; font-size: 0.875rem; margin-top: 1rem; }
    .mb-3 { margin-bottom: 1rem; }
    .spinner-border-sm { width: 1rem; height: 1rem; border-width: 0.15em; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="top-accent"></div>
    <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back</a>
    <div class="login-icon">🛡️</div>
    <h1>Admin Login</h1>
    <p class="subtitle">Sign in with your admin credentials</p>

    <div id="loginAlert" class="alert d-none"></div>

    <form id="adminLoginForm" novalidate>
      <div class="mb-3">
        <label for="adminEmail">Username or Email</label>
        <input type="text" id="adminEmail" class="form-control" placeholder="e.g. 255 or 255@hisab.local" required autocomplete="username"/>
      </div>
      <div class="mb-3">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <i class="bi bi-shield-lock"></i> Sign In as Admin
      </button>
    </form>
  </div>

  <script type="module">
    import { adminLogin } from "./auth.js";

    const form = document.getElementById("adminLoginForm");
    const alertEl = document.getElementById("loginAlert");
    const loginBtn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      loginBtn.disabled = true;
      loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Signing in...`;
      alertEl.classList.add("d-none");

      try {
        await adminLogin(email, password);
        window.location.href = "admin-dashboard.html";
      } catch (err) {
        alertEl.className = "alert alert-danger";
        alertEl.textContent = err.message || "Login failed. Check credentials.";
        alertEl.classList.remove("d-none");
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<i class="bi bi-shield-lock"></i> Sign In as Admin`;
      }
    });
  </script>
</body>
</html>
