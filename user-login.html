<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Member Login — হিসাব</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml"/>
  <style>
    :root {
      --clr-bg: #f6f8fb;
      --clr-card: #ffffff;
      --clr-border: #d8dee8;
      --clr-user: #2563eb;
      --clr-text: #172033;
      --clr-muted: #667085;
    }
    body {
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(37,99,235,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(217,154,0,0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .login-wrap {
      width: 100%; max-width: 420px;
      background: var(--clr-card);
      border: 1px solid var(--clr-border);
      border-radius: 18px;
      padding: 2.5rem;
      position: relative;
      box-shadow: 0 24px 64px rgba(15,23,42,0.12);
    }
    .top-accent {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 80px; height: 3px;
      background: var(--clr-user);
      border-radius: 0 0 4px 4px;
    }
    .back-link {
      color: var(--clr-muted);
      font-size: 0.875rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--clr-text); }
    .login-icon {
      width: 56px; height: 56px;
      background: rgba(37,99,235,0.1);
      border: 1.5px solid rgba(37,99,235,0.3);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .subtitle { color: var(--clr-muted); font-size: 0.875rem; margin-bottom: 1.75rem; }
    label { font-size: 0.85rem; font-weight: 500; color: var(--clr-muted); margin-bottom: 0.35rem; display: block; }
    .form-control {
      background: #ffffff;
      border: 1px solid var(--clr-border);
      color: var(--clr-text);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      font-family: 'Space Grotesk', sans-serif;
    }
    .form-control:focus {
      background: #ffffff;
      color: var(--clr-text);
      border-color: var(--clr-user);
      box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
      outline: none;
    }
    .btn-login {
      width: 100%;
      background: var(--clr-user);
      color: #ffffff;
      font-weight: 700;
      border: none;
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
    }
    .btn-login:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,0.24); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .alert { border-radius: 10px; font-size: 0.875rem; margin-top: 1rem; }
    .mb-3 { margin-bottom: 1rem; }
    .hint { font-size: 0.78rem; color: var(--clr-muted); margin-top: 0.35rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="top-accent"></div>
    <a href="index.html" class="back-link"><i class="bi bi-arrow-left"></i> Back</a>
    <div class="login-icon">👤</div>
    <h1>Member Login</h1>
    <p class="subtitle">Use your email and password provided by admin</p>

    <div id="loginAlert" class="alert d-none"></div>

    <form id="userLoginForm" novalidate>
      <div class="mb-3">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="e.g. masud@gmail.com" required autocomplete="email"/>
        <p class="hint">Old members can still enter username if their account uses the old login.</p>
      </div>
      <div class="mb-3">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <i class="bi bi-person"></i> Sign In
      </button>
      <button type="button" class="btn-login mt-2" id="resetBtn" style="background:#ffffff;color:var(--clr-user);border:1px solid var(--clr-border);">
        <i class="bi bi-envelope"></i> Send Password Reset Email
      </button>
    </form>
  </div>

  <script type="module">
    import { sendResetEmail, userLogin } from "./auth.js";

    const form = document.getElementById("userLoginForm");
    const alertEl = document.getElementById("loginAlert");
    const loginBtn = document.getElementById("loginBtn");
    const resetBtn = document.getElementById("resetBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginBtn.disabled = true;
      loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm border-dark"></span> Signing in...`;
      alertEl.classList.add("d-none");

      try {
        await userLogin(email, password);
        window.location.href = "user-dashboard.html";
      } catch (err) {
        alertEl.className = "alert alert-danger";
        alertEl.textContent = "Invalid username or password.";
        alertEl.classList.remove("d-none");
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<i class="bi bi-person"></i> Sign In`;
      }
    });

    resetBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      if (!email || !email.includes("@")) {
        alertEl.className = "alert alert-danger";
        alertEl.textContent = "Enter your real email first.";
        alertEl.classList.remove("d-none");
        return;
      }

      resetBtn.disabled = true;
      alertEl.classList.add("d-none");

      try {
        await sendResetEmail(email);
        alertEl.className = "alert alert-success";
        alertEl.textContent = "Password reset email sent.";
        alertEl.classList.remove("d-none");
      } catch (err) {
        alertEl.className = "alert alert-danger";
        alertEl.textContent = "Password reset email could not be sent.";
        alertEl.classList.remove("d-none");
      } finally {
        resetBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
